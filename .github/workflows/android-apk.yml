# Builds an installable Android APK of the mobile app (for testing on a phone).
# Runs on every push to the mobile-prototype branch, or by hand: Actions > Android APK > Run workflow.
# The APK is signed with the debug key: fine to install and test, not for Google Play.
name: Android APK

on:
  push:
    branches: [mobile-prototype]
    paths:
      - "mobile/**"
      - "lib/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      # Public values, inlined into the app when it is bundled. The key is a repository secret.
      EXPO_PUBLIC_SUPABASE_URL: https://ppbfvmpndewaazeosyjs.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_API_URL: https://www.sabaibiz.com
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Check the Supabase key is set
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing secret EXPO_PUBLIC_SUPABASE_ANON_KEY. Add it in the repository: Settings > Secrets and variables > Actions > New repository secret. Then re-run this job."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: sabaibiz-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
